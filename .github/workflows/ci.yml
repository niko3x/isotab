name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build and UI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make pkg-config libgtk-3-dev libglib2.0-dev librsvg2-common xvfb
      - name: Build
        run: make
      - name: Run unit and security regression tests
        run: make test
      - name: Run UI tests in a virtual display
        env:
          # The headless runner has no desktop accessibility bus.
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a make ui-test
      - name: Check installer syntax
        run: bash -n install.sh ci/kernel-vm.sh ci/old-libraries.sh

  oldest-libraries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test with GLib 2.66 and GCC 10
        run: bash ci/old-libraries.sh

  kernel-5-15:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Test inside an Ubuntu 22.04 VM running Linux 5.15
        run: bash ci/kernel-vm.sh
